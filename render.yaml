services:
  - type: web
    name: job-market-api
    env: python
    buildCommand: pip install -r backend-requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: job_board_intelligence
      - key: GOOGLE_API_KEY
        sync: false
